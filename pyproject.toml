[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cswap-widget"
version = "1.0.0"
description = "Modern desktop quota manager and multi-account switcher widget for Claude Code (claude-swap)."
readme = "README.md"
authors = [{ name = "Taha Akdoğan" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "cswap", "claude-swap", "pyqt6", "widget", "account-switcher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "PyQt6>=6.5.0",
]

[project.scripts]
cswap-widget = "cswap_widget.main:main"

[project.urls]
Homepage = "https://github.com/tahakdgn/cswap-widget"
Repository = "https://github.com/tahakdgn/cswap-widget.git"
Issues = "https://github.com/tahakdgn/cswap-widget/issues"

[tool.setuptools.packages.find]
where = ["src"]
